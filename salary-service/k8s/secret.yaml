apiVersion: v1
kind: Secret
metadata:
  name: salary-service-secret
  namespace: app
type: Opaque
stringData:
  # Replace with actual connection string before deploying.
  # Format: postgres://<user>:<password>@<host>:5432/<dbname>?sslmode=disable
  # Same shared postgres as docker-compose, scoped to salary_schema via search_path
  DATABASE_URL: "postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>?search_path=salary_schema&sslmode=disable"
