apiVersion: v1
kind: Service
metadata:
  name: salary-service
  namespace: app
  labels:
    app: salary-service
spec:
  selector:
    app: salary-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP   # Not exposed publicly — traffic enters via Ingress only
