apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: app
  labels:
    app: search-service
spec:
  selector:
    app: search-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP   # Not exposed publicly — traffic enters via Ingress only
