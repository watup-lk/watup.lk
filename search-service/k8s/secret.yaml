apiVersion: v1
kind: Secret
metadata:
  name: search-service-secret
  namespace: app
type: Opaque
stringData:
  # Replace with actual connection string before deploying.
  # Format: postgres://<user>:<password>@<host>:5432/<dbname>?sslmode=disable
  # Same shared postgres as docker-compose, no schema restriction needed for search
  DATABASE_URL: "postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>?sslmode=disable"
