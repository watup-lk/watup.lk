# ClusterIP — stats-service is internal only, accessed via BFF through Ingress.
apiVersion: v1
kind: Service
metadata:
  name: stats-service
  namespace: app
  labels:
    app: stats-service
spec:
  type: ClusterIP
  selector:
    app: stats-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
