name: Infra DB CI/CD

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "infra-db/**"
      - ".github/workflows/infra-db-ci.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
    paths:
      - "infra-db/**"
      - ".github/workflows/infra-db-ci.yml"

permissions:
  contents: read

env:
  SERVICE_PATH: infra-db
  IMAGE_NAME: watup-db

jobs:
  validate:
    name: Validate Database Image Context
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Dockerfile and init scripts
        run: |
          test -f Dockerfile
          find init-scripts -type f -name "*.sql" -print -quit | grep .

