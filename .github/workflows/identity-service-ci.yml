name: Identity Service CI/CD

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "identity-service/**"
      - ".github/workflows/identity-service-ci.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
    paths:
      - "identity-service/**"
      - ".github/workflows/identity-service-ci.yml"

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.25"
  SERVICE_PATH: identity-service
  IMAGE_NAME: identity-service

jobs:
  test:
    name: Test and Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Download and verify dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: |
          go test -v -race -covermode=atomic \
            -coverpkg=./internal/service/...,./internal/handlers/...,./internal/middleware/...,./internal/config/...,./internal/grpcserver/... \
            -coverprofile=coverage.out \
            ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "Coverage %.2f%% is below required 80%%\n", coverage; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-coverage
          path: |
            identity-service/coverage.out
            identity-service/coverage-summary.txt
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: identity-service-coverage
          path: identity-service

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: identity-service
          args: >
            -Dsonar.projectKey=watup-lk
            -Dsonar.projectName=watup.lk
            -Dsonar.go.coverage.reportPaths=coverage.out

  security:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test, sonarqube]
    defaults:
      run:
        working-directory: identity-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('identity-service/gosec-results.sarif') != ''
        with:
          sarif_file: identity-service/gosec-results.sarif
          category: gosec-identity-service

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  publish:
    name: Build, Scan, and Push ACR Image
    runs-on: ubuntu-latest
    needs: [test, sonarqube, security]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    defaults:
      run:
        working-directory: identity-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Compute image tags
        id: meta
        run: |
          REPOSITORY_URI="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          echo "sha_tag=${REPOSITORY_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REPOSITORY_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-identity-service

      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      - name: Trigger k8s deployment
        run: |
          gh api repos/watup-lk/watup.lk-k8s-deployment-1/dispatches \
            --method POST \
            -f event_type=service-updated \
            -f client_payload[service_name]="${{ env.IMAGE_NAME }}" \
            -f client_payload[image_tag]="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN }}
