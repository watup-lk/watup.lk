name: Stats Service CI/CD

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "stats-service/**"
      - ".github/workflows/stats-service-ci.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
    paths:
      - "stats-service/**"
      - ".github/workflows/stats-service-ci.yml"

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "20"
  SERVICE_PATH: stats-service
  IMAGE_NAME: stats-service

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: stats-service-coverage
          path: stats-service/coverage/lcov.info
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: stats-service-coverage
          path: stats-service/coverage

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: stats-service
          args: >
            -Dsonar.projectKey=watup-lk
            -Dsonar.projectName=watup.lk
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  security:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test, sonarqube]
    defaults:
      run:
        working-directory: stats-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload NPM audit report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('stats-service/npm-audit.json') != ''
        with:
          name: stats-service-npm-audit
          path: stats-service/npm-audit.json
          retention-days: 7

  publish:
    name: Build, Scan, and Push ACR Image
    runs-on: ubuntu-latest
    needs: [test, sonarqube, security]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    defaults:
      run:
        working-directory: stats-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Compute image tags
        id: meta
        run: |
          REPOSITORY_URI="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          echo "sha_tag=${REPOSITORY_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REPOSITORY_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-stats-service

      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      - name: Trigger k8s deployment
        run: |
          gh api repos/watup-lk/watup.lk-k8s-deployment-1/dispatches \
            --method POST \
            -f event_type=service-updated \
            -f client_payload[service_name]="${{ env.IMAGE_NAME }}" \
            -f client_payload[image_tag]="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN }}
