name: Publish to ACR

on:
  workflow_run:
    workflows:
      - "Identity Service CI/CD"
      - "Vote Service CI/CD"
      - "Salary Service CI/CD"
      - "Search Service CI/CD"
      - "BFF CI/CD"
      - "Frontend CI/CD"
      - "Stats Service CI/CD"
      - "Infra DB CI/CD"
    types:
      - completed
    branches:
      - "main"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  publish-identity-service:
    name: Publish Identity Service
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Identity Service CI/CD'
    env:
      IMAGE_NAME: identity-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Compute image tags
        id: meta
        run: |
          REPOSITORY_URI="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha_tag=${REPOSITORY_URI}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REPOSITORY_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --label "org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            identity-service/

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-identity-service

      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      - name: Trigger k8s deployment
        run: |
          gh api repos/watup-lk/watup.lk-k8s-deployment-1/dispatches \
            --method POST \
            -f event_type=service-updated \
            -f client_payload[service_name]="${{ env.IMAGE_NAME }}" \
            -f client_payload[image_tag]="${{ github.event.workflow_run.head_sha }}"
        env:
          GH_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN }}


