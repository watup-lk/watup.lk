name: BFF CI/CD

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "bff/**"
      - ".github/workflows/bff-ci.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
    paths:
      - "bff/**"
      - ".github/workflows/bff-ci.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  SERVICE_PATH: bff
  IMAGE_NAME: bff

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: bff-coverage
          path: bff/coverage/lcov.info
          retention-days: 7


  security:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: bff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload NPM audit report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('bff/npm-audit.json') != ''
        with:
          name: bff-npm-audit
          path: bff/npm-audit.json
          retention-days: 7
