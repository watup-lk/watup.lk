name: BFF CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - "main"
    paths:
      - "bff/**"
      - ".github/workflows/bff-ci.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  SERVICE_PATH: bff
  IMAGE_NAME: bff

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    defaults:
      run:
        working-directory: bff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: bff-coverage
          path: bff/coverage/lcov.info
          retention-days: 7


  security:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: bff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload NPM audit report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('bff/npm-audit.json') != ''
        with:
          name: bff-npm-audit
          path: bff/npm-audit.json
          retention-days: 7


  publish:
    name: Build, Scan, and Push ACR Image
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    defaults:
      run:
        working-directory: bff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          REPOSITORY_URI="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          echo "sha_tag=${REPOSITORY_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REPOSITORY_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: bff-trivy
          path: trivy-results.sarif
          retention-days: 7

      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      - name: Trigger k8s deployment
        run: |
          gh api repos/watup-lk/watup.lk-k8s-deployment/dispatches \
            --method POST \
            -f event_type=service-updated \
            -f client_payload[service_name]="${{ env.IMAGE_NAME }}" \
            -f client_payload[image_tag]="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN }}
