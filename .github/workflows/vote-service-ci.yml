name: Vote Service CI/CD

on:
  push:
    branches:
      - "feature/**"
      - "main"
    paths:
      - "vote-service/**"
      - ".github/workflows/vote-service-ci.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
    paths:
      - "vote-service/**"
      - ".github/workflows/vote-service-ci.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  SERVICE_PATH: vote-service
  IMAGE_NAME: vote-service

jobs:
  test:
    name: Test and Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vote-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Download and verify dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: |
          go test -v -race -covermode=atomic \
            -coverpkg=./internal/config/...,./internal/service/...,./internal/repository/... \
            -coverprofile=coverage.out \
            ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "Coverage %.2f%% is below required 80%%\n", coverage; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vote-service-coverage
          path: |
            vote-service/coverage.out
            vote-service/coverage-summary.txt
          retention-days: 7


  security:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vote-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload gosec results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vote-service-gosec
          path: vote-service/gosec-results.sarif
          retention-days: 7

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
