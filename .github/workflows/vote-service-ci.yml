name: Vote Service CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - "main"
    paths:
      - "vote-service/**"
      - ".github/workflows/vote-service-ci.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  SERVICE_PATH: vote-service
  IMAGE_NAME: vote-service

jobs:
  test:
    name: Test and Quality
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    defaults:
      run:
        working-directory: vote-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Download and verify dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: |
          go test -v -race -covermode=atomic \
            -coverpkg=./internal/config/...,./internal/service/...,./internal/repository/... \
            -coverprofile=coverage.out \
            ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "Coverage %.2f%% is below required 80%%\n", coverage; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vote-service-coverage
          path: |
            vote-service/coverage.out
            vote-service/coverage-summary.txt
          retention-days: 7


  security:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vote-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload gosec results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vote-service-gosec
          path: vote-service/gosec-results.sarif
          retention-days: 7

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...


  publish:
    name: Build, Scan, and Push ACR Image
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    defaults:
      run:
        working-directory: vote-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          REPOSITORY_URI="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          echo "sha_tag=${REPOSITORY_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REPOSITORY_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-vote-service

      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      - name: Trigger k8s deployment
        run: |
          gh api repos/watup-lk/watup.lk-k8s-deployment/dispatches \
            --method POST \
            -f event_type=service-updated \
            -f client_payload[service_name]="${{ env.IMAGE_NAME }}" \
            -f client_payload[image_tag]="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN }}
